<div class="inline-drawer" id="cw-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <strong>只给思念让路</strong>
        <div class="flex-container gap5" style="margin-left: auto;">
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
    </div>
    <div class="inline-drawer-content">
        <!-- 强制纵向排列，左对齐 -->
        <div class="flex-container flexFlowColumn gap10" style="padding: 10px 0; align-items: flex-start;">
            
            <label class="flex-container" style="margin:0;">
                <input type="checkbox" id="cw_chk_enable" />
                <span><strong>开启插件</strong></span>
            </label>
            
            <div id="cw_btn_open_panel" class="menu_button" style="padding: 4px 16px; cursor: pointer; user-select: none; background: var(--SmartThemeButtonBg, #4a6fa5); color: var(--SmartThemeButtonText, #fff); border-radius: 4px; border: 1px solid var(--SmartThemeBorderColor, #555); transition: 0.2s; font-size: 0.9em; white-space: nowrap; display: inline-block;">
                <strong>⚙️ 打开思念控制台</strong>
            </div>

            <label class="flex-container" style="margin:0;">
                <input type="checkbox" id="cw_chk_float" />
                <span><strong>桌面悬浮 UI</strong></span>
            </label>

        </div>
    </div>
</div>
